name: Mise à jour statut feature

on:
  pull_request:
    types: [closed]
    branches: [dev]

jobs:
  update-feature-status:
    # Se déclenche uniquement si la PR est mergée et vient d'une branche feature/
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Générer un token GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: Extraire l'ID de la feature depuis le nom de branche
        id: feature
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          # Extrait l'ID ex: AUTH-01, WEB-I18N-01 depuis feature/AUTH-01-nom ou feature/WEB-I18N-01-nom
          # || true empêche grep (exit 1 si aucun match) de faire échouer le step
          FEATURE_ID=$(echo "$BRANCH" | sed 's|feature/||' | grep -oE '^[A-Z][A-Z0-9]*(-[A-Z][A-Z0-9]*)*-[0-9]+' || true)
          echo "id=$FEATURE_ID" >> $GITHUB_OUTPUT
          echo "Feature ID détecté : $FEATURE_ID"

      - name: Mettre à jour features.md
        run: |
          FEATURE_ID="${{ steps.feature.outputs.id }}"

          BRANCH="${{ github.event.pull_request.head.ref }}"

          # Ces deux cas sortaient en succès : une PR mergée pouvait ne rien mettre à jour
          # sans que personne en soit averti. Ils échouent maintenant. L'échec est
          # post-merge, donc c'est une alarme et non un blocage — le blocage est assuré
          # par le job « Entrée de suivi » de ci.yml, exigé avant merge.
          if [ -z "$FEATURE_ID" ]; then
            echo "::error::Aucun identifiant extrait de la branche '$BRANCH'. Le format attendu est feature/XXX-00-nom — cette PR a été mergée sans mettre à jour features.md."
            exit 1
          fi

          # Trouve la ligne du header de la feature
          LINE=$(grep -n "### ${FEATURE_ID}" .ai/features.md | head -1 | cut -d: -f1)

          if [ -z "$LINE" ]; then
            echo "::error::Aucune section '### $FEATURE_ID' dans .ai/features.md. La branche '$BRANCH' a été mergée sans que le suivi en garde trace — ajouter l'entrée, puis remettre son statut à la main."
            exit 1
          fi

          # Met à jour le statut sur la ligne +2 (header → ligne vide → statut)
          sed -i "$((LINE+2))s/\`\[.\]/\`[x]/" .ai/features.md
          echo "Feature $FEATURE_ID marquée comme terminée [x]"

      - name: Commit et push sur dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ai/features.md
          # Ne committe que si le fichier a changé
          git diff --staged --quiet || git commit -m "chore: feature ${{ steps.feature.outputs.id }} terminée [x]"
          git pull --rebase origin dev
          git push origin dev
