name: Mise à jour statut feature en cours

on:
  create:

jobs:
  feature-in-progress:
    # Se déclenche uniquement si la branche créée respecte le format feature/XXX-00-nom
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest

    steps:
      - name: Générer un token GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: Extraire l'ID de la feature depuis le nom de branche
        id: feature
        run: |
          BRANCH="${{ github.ref_name }}"
          # Extrait l'ID ex: AUTH-01, WEB-I18N-01 depuis feature/AUTH-01-nom ou feature/WEB-I18N-01-nom
          # || true empêche grep (exit 1 si aucun match) de faire échouer le step
          FEATURE_ID=$(echo "$BRANCH" | sed 's|feature/||' | grep -oE '^[A-Z][A-Z0-9]*(-[A-Z][A-Z0-9]*)*-[0-9]+' || true)
          echo "id=$FEATURE_ID" >> $GITHUB_OUTPUT
          echo "Feature ID détecté : $FEATURE_ID"

      - name: Mettre à jour features.md
        run: |
          FEATURE_ID="${{ steps.feature.outputs.id }}"

          BRANCH="${{ github.ref_name }}"

          # Ce job lit features.md sur dev (checkout ref: dev), pas sur la branche créée.
          # Son échec dit donc exactement une chose : l'entrée n'est pas encore sur dev,
          # et le statut [~] ne pourra pas être posé. Rien n'est bloqué — il n'y a pas
          # encore de PR — mais l'alerte tombe au démarrage, quand la corriger coûte
          # une entrée à écrire plutôt qu'un suivi à reconstituer après coup.
          if [ -z "$FEATURE_ID" ]; then
            echo "::error::Aucun identifiant extrait de la branche '$BRANCH'. Format attendu : feature/XXX-00-nom-court."
            exit 1
          fi

          # Trouve la ligne du header de la feature
          LINE=$(grep -n "### ${FEATURE_ID}" .ai/features.md | head -1 | cut -d: -f1)

          if [ -z "$LINE" ]; then
            echo "::error::Aucune section '### $FEATURE_ID' dans .ai/features.md sur dev. L'entrée doit être mergée sur dev avant la création de la branche, sinon le statut reste [ ] pendant tout le développement."
            exit 1
          fi

          # Met à jour le statut sur la ligne +2 (header → ligne vide → statut)
          sed -i "$((LINE+2))s/\`\[ \]/\`[~]/" .ai/features.md
          echo "Feature $FEATURE_ID marquée en cours [~]"

      - name: Commit et push sur dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .ai/features.md
          # Ne committe que si le fichier a changé
          git diff --staged --quiet || git commit -m "chore: feature ${{ steps.feature.outputs.id }} en cours [~]"
          git pull --rebase origin dev
          git push origin dev
