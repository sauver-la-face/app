name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

jobs:
  lint:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Vérifier le lint et le format
        run: bun run lint

  typecheck:
    name: Vérification TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Vérifier les types — backend
        run: cd apps/backend && bunx tsc --noEmit

      - name: Vérifier les types — web
        run: cd apps/web && bunx tsc --noEmit

      - name: Vérifier les types — mobile
        run: cd apps/mobile && bunx tsc --noEmit

  test:
    name: Tests (bun:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Lancer les tests
        run: bun test --recursive
