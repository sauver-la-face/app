name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]

jobs:
  suivi:
    name: Entrée de suivi
    # Seules les PR sont concernées : sur un push direct il n'y a plus rien à empêcher.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Vérifier que la branche est rattachée à une entrée de features.md
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"

          # Hors convention feature/ ou fix/ : rien à rattacher, on laisse passer.
          # Les branches de maintenance (chore/, deps/, release/) n'ont pas d'entrée
          # de suivi et n'en attendent pas.
          case "$BRANCH" in
            feature/*|fix/*) ;;
            *) echo "Branche '$BRANCH' hors convention feature/ ou fix/ — rien à vérifier"; exit 0 ;;
          esac

          PREFIXE="${BRANCH%%/*}"
          ID=$(echo "${BRANCH#*/}" | grep -oE '^[A-Z][A-Z0-9]*(-[A-Z][A-Z0-9]*)*-[0-9]+' || true)

          if [ -z "$ID" ]; then
            echo "::error::La branche '$BRANCH' ne porte pas d'identifiant lisible. Format attendu : $PREFIXE/XXX-00-nom-court, par exemple $PREFIXE/AUTH-01-jwt-patients."
            exit 1
          fi

          if ! grep -q "^### ${ID}\b" .ai/features.md; then
            echo "::error::Aucune section '### $ID' dans .ai/features.md. Une branche décrit un travail spécifié : ajouter l'entrée sur dev avant d'ouvrir cette PR, sinon le suivi ne verra jamais ce travail passer."
            exit 1
          fi

          echo "$ID rattaché à son entrée dans .ai/features.md"

  lint:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node est fixe explicitement : sans cela les jobs heritent de la version
      # preinstallee sur le runner, qui change sans preavis. Doit rester en
      # accord avec le champ engines de package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Vérifier le lint et le format
        run: bun run lint

  typecheck:
    name: Vérification TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node est fixe explicitement : sans cela les jobs heritent de la version
      # preinstallee sur le runner, qui change sans preavis. Doit rester en
      # accord avec le champ engines de package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Compiler le package shared
        run: bun run build:shared

      - name: Vérifier les types — backend
        run: cd apps/backend && bunx tsc --noEmit

      - name: Vérifier les types — web
        run: |
          if [ -d "apps/web/src" ]; then
            cd apps/web && bunx tsc --noEmit
          else
            echo "apps/web/src non trouvé — typecheck ignoré (feature non implémentée)"
          fi

      - name: Vérifier les types — mobile
        run: |
          if [ -d "apps/mobile/src" ]; then
            cd apps/mobile && bunx tsc --noEmit
          else
            echo "apps/mobile/src non trouvé — typecheck ignoré (feature non implémentée)"
          fi

  build-web:
    name: Build Next.js (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node est fixe explicitement : sans cela les jobs heritent de la version
      # preinstallee sur le runner, qui change sans preavis. Doit rester en
      # accord avec le champ engines de package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Compiler le package shared
        run: bun run build:shared

      - name: Construire le dashboard web
        run: |
          if [ -d "apps/web/src" ]; then
            bun run --cwd apps/web build
          else
            echo "apps/web/src non trouvé — build ignoré (feature non implémentée)"
          fi
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      # Meme job que le build : `next start` a besoin du dossier .next produit
      # juste au-dessus, et les artefacts ne sont pas partages entre jobs.
      - name: Démarrer le serveur de production
        run: |
          if [ -d "apps/web/src" ]; then
            nohup bun run --cwd apps/web start > /tmp/web-server.log 2>&1 &
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null http://localhost:3000; then
                echo "Serveur prêt"
                exit 0
              fi
              sleep 1
            done
            echo "Le serveur n'a pas répondu sur http://localhost:3000"
            exit 1
          fi
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: Tests de rendu des routes
        run: |
          if [ -d "apps/web/tests" ]; then
            bun run --cwd apps/web test
          else
            echo "apps/web/tests non trouvé — tests de rendu ignorés"
          fi
        env:
          WEB_BASE_URL: http://localhost:3000

  test-unit:
    name: Tests unitaires (bun:test)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sauver_la_face
      BETTER_AUTH_SECRET: ci-test-secret
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      # Node est fixe explicitement : sans cela les jobs heritent de la version
      # preinstallee sur le runner, qui change sans preavis. Doit rester en
      # accord avec le champ engines de package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Lancer les tests unitaires
        run: bun run --cwd apps/backend test:unit

  test-integration:
    name: Tests d'intégration (bun:test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sauver_la_face
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sauver_la_face
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/sauver_la_face
      BETTER_AUTH_SECRET: ci-test-secret
      BETTER_AUTH_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7

      # Node est fixe explicitement : sans cela les jobs heritent de la version
      # preinstallee sur le runner, qui change sans preavis. Doit rester en
      # accord avec le champ engines de package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install

      - name: Compiler le package shared
        run: bun run build:shared

      - name: Appliquer les migrations Drizzle
        run: bun run --cwd apps/backend db:migrate

      - name: Lancer les tests d'intégration
        run: bun run --cwd apps/backend test:integration

  # DEVOPS-13 — les autres jobs valident le code, jamais les images livrees.
  # Les cibles `prod` des deux Dockerfile n'etaient construites que sur le poste
  # de la personne qui les ecrivait : celle du backend ne l'avait jamais ete du
  # tout, la « production » du compose construisant `target: dev` jusqu'a
  # DEVOPS-02. Une image qui ne demarre pas ne se voit qu'au deploiement.
  #
  # Construire ne suffit pas : une image web peut se construire, repondre 200,
  # et servir une page dont le CSS et le JavaScript tombent en 404 quand
  # `.next/static` n'a pas ete recopie. Chaque image est donc demarree et
  # interrogee.
  docker:
    name: Images Docker (cibles prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construire l'image backend (cible prod)
        run: docker build -f apps/backend/Dockerfile --target prod -t slf-backend:ci .

      # Secrets jetables generes a la volee : ils ne servent qu'a franchir les
      # gardes de demarrage de ce conteneur, detruit a la fin du job. Rien n'est
      # ecrit en dur, et BETTER_AUTH_SECRET depasse les 32 caracteres exiges.
      #
      # DATABASE_URL pointe volontairement dans le vide : `/health` ne touche pas
      # la base, et exiger un Postgres ici ferait echouer le job pour une raison
      # etrangere a ce qu'il verifie.
      - name: Démarrer le backend et vérifier /health
        run: |
          docker run -d --name slf-backend-ci -p 3001:3001 \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/absente \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 48)" \
            -e BETTER_AUTH_URL=http://localhost:3001 \
            slf-backend:ci

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/health; then
              echo "Backend prêt"
              exit 0
            fi
            sleep 1
          done

          echo "Le backend n'a pas répondu sur /health"
          docker logs slf-backend-ci
          exit 1

      - name: Construire l'image web (cible prod)
        run: |
          docker build -f apps/web/Dockerfile --target prod \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 \
            -t slf-web:ci .

      - name: Démarrer le dashboard web
        run: |
          docker run -d --name slf-web-ci -p 3000:3000 slf-web:ci

          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/fr; then
              echo "Dashboard prêt"
              exit 0
            fi
            sleep 1
          done

          echo "Le dashboard n'a pas répondu sur /fr"
          docker logs slf-web-ci
          exit 1

      # Le piege du mode standalone : `.next/static` et `public/` ne sont pas
      # traces par Next et se recopient a part dans le Dockerfile. Les oublier
      # donne une page en 200 dont tous les assets sont en 404 — invisible sans
      # cette verification.
      - name: Vérifier que les fichiers statiques sont servis
        run: |
          curl -sf http://localhost:3000/fr -o /tmp/page.html

          assets=$(grep -oE '/_next/static/[^"]+\.(css|js)' /tmp/page.html | sort -u | head -3)

          if [ -z "$assets" ]; then
            echo "Aucun fichier statique référencé dans la page — vérification impossible"
            exit 1
          fi

          for asset in $assets; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$asset")
            echo "$code  $asset"
            [ "$code" = "200" ] || exit 1
          done

      # `config` resout les variables et les fichiers references : une faute de
      # frappe dans un chemin ou un service inconnu echoue ici plutot qu'au
      # deploiement. CADDY_DOMAIN_* n'est pas defini sur le runner — sans valeur,
      # Compose avertit sans echouer, ce qui n'apprend rien : on en fournit une.
      - name: Vérifier que le fichier Compose de production est valide
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          CADDY_DOMAIN_API: api.exemple.test
          CADDY_DOMAIN_WEB: web.exemple.test

      - name: Arrêter les conteneurs
        if: always()
        run: docker rm -f slf-backend-ci slf-web-ci || true
