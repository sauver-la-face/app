# Base commune aux deux environnements.
#
# DEVOPS-11 : ce fichier ne contient plus rien de specifique au developpement.
# Les montages de code, la cible `dev` du Dockerfile et l'exposition du port
# backend vivent desormais dans docker-compose.override.yml, charge
# automatiquement par `docker compose up` en local et ignore des que l'on passe
# des `-f` explicites — ce que fait la commande de deploiement.
#
#   dev  : docker compose --profile dev up
#   prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#            --profile prod --env-file .env.production up
#
# Un `volumes: []` dans un fichier de surcharge ne supprime pas les montages du
# fichier de base : ils fusionnent par chemin cible. C'est pourquoi la
# separation se fait ici, et non par annulation cote production.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Confort d'administration, jamais critique. `on-failure` plutot que
  # `unless-stopped` : sans PGADMIN_EMAIL ni PGADMIN_PASSWORD dans .env.local,
  # l'image refuse de demarrer, et une relance perpetuelle noyait la vraie cause
  # dans les journaux. Trois tentatives suffisent a la rendre lisible, puis le
  # service s'arrete sans gener le reste de la pile.
  pgadmin:
    image: dpage/pgadmin4
    restart: on-failure:3
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      postgres:
        condition: service_healthy

  # MinIO ne tourne qu'en developpement : la production utilise OVH Object
  # Storage, certifie HDS (ADR 0011).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sans `target`, Docker construit la derniere etape du Dockerfile, soit
  # `prod`. Le developpement demande explicitement `dev` dans l'override.
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
  pgadmin_data:
